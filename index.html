function makeLocalBackend() {
  const KEY = "hakding_demo_v1";
  let store = null;
  try { store = JSON.parse(localStorage.getItem(KEY)); } catch (e) { store = null; }
  if (!store) store = seed();
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} };
  save();
  const col = (c) => store[c] || (store[c] = {});
  const clone = (o) => JSON.parse(JSON.stringify(o));
  let user = null; const subs = [];
  try { user = JSON.parse(sessionStorage.getItem("hakding_demo_user")); } catch (e) { user = null; }
  const emit = () => subs.forEach((f) => f(user));
  return {
    db: {
      async get(c, id) { const d = col(c)[id]; return d ? { id, ...clone(d) } : null; },
      async list(c, where) { let a = Object.entries(col(c)).map(([id, d]) => ({ id, ...clone(d) })); if (where) { const [f, op, v] = where; a = a.filter((d) => (op === ">" ? (d[f] || 0) > v : d[f] === v)); } return a; },
      async set(c, id, data) { col(c)[id] = clone(data); save(); },
      async update(c, id, p) { if (!col(c)[id]) throw new Error("없는 문서"); Object.assign(col(c)[id], clone(p)); save(); },
      async add(c, data) { const id = c.slice(0, 1) + now().toString(36) + Math.random().toString(36).slice(2, 6); col(c)[id] = clone(data); save(); return id; },
      async del(c, id) { delete col(c)[id]; save(); },
      async inc(c, id, f) { const d = col(c)[id] || (col(c)[id] = {}); d[f] = (d[f] || 0) + 1; save(); },
      async setKey(c, id, m, k, v) { const d = col(c)[id]; if (!d) throw new Error("없는 문서"); d[m] = d[m] || {}; if (v === null) delete d[m][k]; else d[m][k] = v; save(); }
    },
    auth: {
      onChange(cb) { subs.push(cb); cb(user); },
      async login() { demoLoginPicker(); },
      async loginAs(u) { user = u; try { sessionStorage.setItem("hakding_demo_user", JSON.stringify(u)); } catch (e) {} emit(); },
      async logout() { user = null; try { sessionStorage.removeItem("hakding_demo_user"); } catch (e) {} emit(); },
      async deleteAccount() { await this.logout(); }
    },
    reset() { try { localStorage.removeItem(KEY); sessionStorage.removeItem("hakding_demo_user"); sessionStorage.removeItem("hk_visited"); } catch (e) {} location.reload(); }
  };
}

async function makeFirebaseBackend() {
  const B = "https://www.gstatic.com/firebasejs/10.12.2/";
  const [{ initializeApp }, A, F] = await Promise.all([import(B + "firebase-app.js"), import(B + "firebase-auth.js"), import(B + "firebase-firestore.js")]);
  const app = initializeApp(CONFIG.firebase);
  if (CONFIG.appCheckSiteKey) {
    const AC = await import(B + "firebase-app-check.js");
    AC.initializeAppCheck(app, { provider: new AC.ReCaptchaV3Provider(CONFIG.appCheckSiteKey), isTokenAutoRefreshEnabled: true });
  }
  const auth = A.getAuth(app); const fs = F.getFirestore(app);
  if (CONFIG.firebase.measurementId) {
    import(B + "firebase-analytics.js").then(async (GA) => { if (await GA.isSupported()) { const ga = GA.getAnalytics(app); track = (name, params) => { try { GA.logEvent(ga, name, params || {}); } catch (e) {} }; } }).catch(() => {});
  }
  const ref = (c, id) => F.doc(fs, c, id);
  try { await A.getRedirectResult(auth); } catch (e) { console.warn(e); }
  return {
    db: {
      async get(c, id) { const s = await F.getDoc(ref(c, id)); return s.exists() ? { id: s.id, ...s.data() } : null; },
      async list(c, where) { const q = where ? F.query(F.collection(fs, c), F.where(...where)) : F.collection(fs, c); const s = await F.getDocs(q); return s.docs.map((d) => ({ id: d.id, ...d.data() })); },
      set: (c, id, d) => F.setDoc(ref(c, id), d),
      update: (c, id, p) => F.updateDoc(ref(c, id), p),
      async add(c, d) { const r = await F.addDoc(F.collection(fs, c), d); return r.id; },
      del: (c, id) => F.deleteDoc(ref(c, id)),
      inc: (c, id, f) => F.setDoc(ref(c, id), { [f]: F.increment(1) }, { merge: true }),
      setKey: (c, id, m, k, v) => F.updateDoc(ref(c, id), { [m + "." + k]: v === null ? F.deleteField() : v })
    },
    auth: {
      onChange(cb) { A.onAuthStateChanged(auth, (u) => cb(u ? { uid: u.uid, email: u.email, emailVerified: u.emailVerified, name: u.displayName } : null)); },
      async login() {
        const p = new A.GoogleAuthProvider(); p.setCustomParameters({ prompt: "select_account" });
        try { await A.signInWithPopup(auth, p); }
        catch (e) { if (["auth/popup-blocked", "auth/operation-not-supported-in-this-environment", "auth/cancelled-popup-request"].includes(e.code)) await A.signInWithRedirect(auth, p); else if (e.code !== "auth/popup-closed-by-user") throw e; }
      },
      logout: () => A.signOut(auth),
      async deleteAccount() { await A.deleteUser(auth.currentUser); }
    }
  };
}

const IDX_CHUNK = 1200;
const toIdx = (a) => ({ i: a.id, n: a.name || "", c: a.category || "기타", d: a.dong || "", t: clip(a.target, 30), a: clip(a.address, 60), u: a.updatedAt || 0, h: a.hidden ? 1 : 0, x: a.closed ? 1 : 0, s: a.sourceId || "" });
const fromIdx = (e) => ({ id: e.i, name: e.n, category: e.c, dong: e.d, target: e.t, address: e.a, updatedAt: e.u, hidden: !!e.h, closed: !!e.x, sourceId: e.s, _idx: true });
async function loadAcademies() {
  const meta = await BE.db.get("publicIndex", "meta").catch(() => null);
  if (!meta || !meta.chunks) { S.data.acadIndexed = false; S.data.indexMeta = null; return BE.db.list("academies").catch(() => []); }
  const parts = await Promise.all(Array.from({ length: meta.chunks }, (_, i) => BE.db.get("publicIndex", "academies_" + i).catch(() => null)));
  const map = new Map();
  parts.forEach((p) => ((p && p.list) || []).forEach((e) => map.set(e.i, fromIdx(e))));
  const fresh = await BE.db.list("academies", ["updatedAt", ">", meta.builtAt]).catch(() => []);
  fresh.forEach((a) => map.set(a.id, a));
  S.data.acadIndexed = true; S.data.indexMeta = { ...meta, fresh: fresh.length };
  return [...map.values()];
}
async function rebuildIndex() {
  const t0 = now();
  const all = await BE.db.list("academies");
  const list = all.map(toIdx);
  const chunks = Math.max(1, Math.ceil(list.length / IDX_CHUNK));
  const old = (S.data.indexMeta && S.data.indexMeta.chunks) || 0;
  for (let i = 0; i < chunks; i++) await BE.db.set("publicIndex", "academies_" + i, { list: list.slice(i * IDX_CHUNK, (i + 1) * IDX_CHUNK) });
  for (let i = chunks; i < old; i++) await BE.db.del("publicIndex", "academies_" + i).catch(() => {});
  await BE.db.set("publicIndex", "meta", { chunks, builtAt: t0, count: list.length });
  return list.length;
}

const visibleReviews = () => S.data.reviews.filter((r) => !r.hidden || S.admin);
function aggFor(aid) {
  const rs = visibleReviews().filter((r) => r.academyId === aid);
  const per = Object.fromEntries(ITEMS.map(([k]) => [k, avg(rs.map((r) => r.scores?.[k] || 0))]));
  const overall = rs.length ? avg(ITEMS.map(([k]) => per[k])) : 0;
  return { count: rs.length, per, overall, reviews: rs.sort((a, b) => keys(b.likes).length - keys(a.likes).length || b.createdAt - a.createdAt) };
}
function ranking(mode) {
  const since = mode === "month" ? new Date(new Date().getFullYear(), new Date().getMonth(), 1).getTime() : 0;
  const m = {};
  visibleReviews().forEach((r) => {
    const n = Object.values(r.likes || {}).filter((t) => (typeof t === "number" ? t : 0) >= since).length;
    if (!m[r.uid]) m[r.uid] = { nick: r.nick, likes: 0, reviews: 0 };
    m[r.uid].likes += n; m[r.uid].reviews += 1;
  });
  return Object.values(m).filter((x) => x.likes > 0).sort((a, b) => b.likes - a.likes || b.reviews - a.reviews).slice(0, 5);
}

  const h = "#/" + view + (param ? "/" + encodeURIComponent(param) : "");
  if (location.hash !== h) location.hash = h; else route();
}
function route() {
  const [, v, p] = location.hash.split("/");
  S.view = v || "home"; S.param = p ? decodeURIComponent(p) : null;
  render(); window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);

   렌더링
   ===================================================================== */

  else if (S.user && S.profile && !passed() && !S.admin && !["privacy", "me", "gate", "review", "academy"].includes(v)) v = "gate";

function acadListData() {
  const show = S.user && (passed() || S.admin);
  let list = S.data.academies.slice();
  if (S.ui.cat !== "전체") list = list.filter((a) => a.category === S.ui.cat);
  if (S.ui.dong !== "전체") list = list.filter((a) => a.dong === S.ui.dong);
  if (S.ui.q) list = list.filter((a) => (a.name + " " + (a.address || "")).includes(S.ui.q));
  const withAgg = list.map((a) => ({ a, g: show ? aggFor(a.id) : { count: 0, overall: 0 } }));
  const sorters = { rating: (x, y) => y.g.overall - x.g.overall || y.g.count - x.g.count, count: (x, y) => y.g.count - x.g.count, name: (x, y) => x.a.name.localeCompare(y.a.name, "ko"), recent: (x, y) => (y.a.updatedAt || 0) - (x.a.updatedAt || 0) };
  withAgg.sort(sorters[show ? S.ui.sort : "name"]);
  return { show, withAgg };
}
function acadListHtml() {
  const { show, withAgg } = acadListData();
  return `<p class="small muted" style="padding:0 2px">${withAgg.length}곳</p>
    <div class="col">${withAgg.slice(0, 300).map((x) => acadCard(x.a, show)).join("") || `<div class="empty">조건에 맞는 학원이 없어요</div>`}</div>${withAgg.length > 300 ? `<p class="small muted">검색어나 과목으로 좁혀 주세요 (상위 300곳 표시)</p>` : ""}`;
}

    <div class="row wrap" style="gap:5px"><span class="badge">${esc(r.childGrade)}</span>${r.goal ? `<span class="badge">목표: ${esc(r.goal)}</span>` : ""}<span class="badge">${esc(r.period)}${r.current ? " · 다니는 중" : ""}</span></div>
    <div class="xs muted">${ITEMS.map(([k, l]) => `${l} ${r.scores?.[k] ?? "-"}`).join(" · ")}</div>
    <div class="row between">
      <span class="small" style="font-weight:600">${esc(r.nick)}${r.hidden ? ' <span class="badge danger">숨김 처리됨</span>' : ""}</span>
      <span class="row" style="gap:2px">

async function loadWiki(aid, tab) {
  const box = $("#wikiBox"); if (!box) return;
  let logs = [];
  try { logs = await BE.db.list("wikiLogs", ["academyId", "==", aid]); } catch (e) { box.innerHTML = `<div class="empty">불러오지 못했어요</div>`; return; }
  logs.sort((a, b) => b.at - a.at);

  const label = { create: "등록", edit: "정보 수정", story: "이야기" };

    <div class="review">

      ${l.type === "story" && S.user && l.uid !== S.user.uid ? `<button class="link xs" style="align-self:flex-end;color:var(--ink3)" data-act="report" data-type="wikiLog" data-id="${esc(l.id)}">신고</button>` : ""}
      ${S.admin && l.type === "story" ? `<button class="link xs" style="align-self:flex-end" data-act="hide" data-col="wikiLogs" data-id="${esc(l.id)}" data-h="${l.hidden ? "0" : "1"}">${l.hidden ? "복구" : "숨김"}</button>` : ""}
    </div>`).join("") : `<div class="empty">${tab === "story" ? "이 학원의 역사와 이야기를 처음으로 남겨 주세요.<br>언제 생겼는지, 어떤 선생님이 유명한지, 어떻게 변해왔는지." : "이력이 없어요"}</div>`;

/* ---------- 스케줄러 ---------- */
function vSchedule() {
  const sc = S.data.schedule || { children: [] };
  const kids = sc.children || [];
  const ci = Math.min(S.ui.child, Math.max(0, kids.length - 1));
  const kid = kids[ci];
  const td = todayDay();
  const todayItems = kid ? kid.items.filter((i) => i.days.includes(td)).sort((a, b) => a.start.localeCompare(b.start)) : [];
  const nowHM = new Date().toTimeString().slice(0, 5);
  const next = todayItems.find((i) => i.start >= nowHM);
  return `
    <section class="col" style="gap:4px;padding:0 2px"><h1>아이 학원 스케줄러</h1><p class="small muted">나만 볼 수 있어요. 아이 이름 대신 '첫째', '둘째'처럼 적어 주세요.</p></section>
    <div class="chips">${kids.map((k, i) => `<button class="chip ${i === ci ? "on" : ""}" data-act="child" data-i="${i}">${esc(k.label)}</button>`).join("")}<button class="chip" data-act="addChild">+ 아이 추가</button></div>
    ${!kid ? `<div class="card"><div class="empty">아이를 추가하고 학원 시간표를 등록해 보세요.<br>요일마다 다른 학원 일정을 한눈에 볼 수 있어요.</div><button class="btn block" data-act="addChild">아이 추가</button></div>` : `
    <section class="hero" style="background:${esc(kid.color)}">
      <span class="small" style="opacity:.9">${esc(kid.label)} · 오늘(${td}) 일정</span>
      ${todayItems.length ? todayItems.map((i) => `<div class="row between" style="border-top:1px solid rgba(255,255,255,.2);padding-top:8px"><b style="font-size:18px">${esc(i.start)} ${esc(i.title)}</b><span class="small">~${esc(i.end)}</span></div>${i.memo ? `<span class="small" style="opacity:.9;margin-top:-6px">준비물·메모: ${esc(i.memo)}</span>` : ""}`).join("") : `<b style="font-size:18px">오늘은 학원이 없어요</b>`}
      ${next ? `<span class="badge accent" style="align-self:flex-start">다음: ${esc(next.start)} ${esc(next.title)}</span>` : ""}
      <button class="btn" data-act="copyToday">아이에게 보낼 문자 복사</button>
    </section>
    <section class="card">
      <div class="row between"><h2>주간 시간표</h2><button class="btn sm" data-act="addItem">일정 추가</button></div>
      ${DAYS.map((d) => { const its = kid.items.filter((i) => i.days.includes(d)).sort((a, b) => a.start.localeCompare(b.start)); return `<div class="sched-day ${d === td ? "today" : ""}"><span class="d">${d}</span><div>${its.map((i) => `<div class="slot"><span class="dot" style="background:${esc(kid.color)}"></span><span class="t">${esc(i.start)}–${esc(i.end)}</span><span class="grow small ellipsis">${esc(i.title)}${i.memo ? ` · <span class="muted">${esc(i.memo)}</span>` : ""}</span><button class="link xs" data-act="delItem" data-id="${esc(i.id)}" aria-label="${esc(i.title)} 삭제">삭제</button></div>`).join("") || `<span class="xs muted" style="line-height:32px">-</span>`}</div></div>`; }).join("")}
    </section>
    <div class="row between"><button class="link small" data-act="renameChild">이름·색 바꾸기</button><button class="link small" style="color:var(--danger)" data-act="delChild">${esc(kid.label)} 삭제</button></div>
    <div class="notice">${icon.info}<span>카카오 알림톡 자동 알림은 다음 단계에서 준비 중이에요. 지금은 '문자 복사'로 아이에게 보내 주세요.</span></div>`}`;
}

function policyHtml() {
  return `<div class="policy col" style="gap:6px">

    <p class="xs muted">시행일 ${esc(CONFIG.policyVersion)} · 법률 검토 전 초안</p>

    <h3>1. 수집하는 정보</h3>
    <ul><li>필수: 구글 로그인 식별값(이메일 포함, 로그인에만 사용하며 다른 회원에게 보이지 않음), 닉네임, 사는 동네, 아이 학년대</li><li>선택: 아파트·단지 이름, 라이딩 글(학원·요일·시간·픽업 장소), 학원 스케줄(아이 별칭·학원 시간표), 카카오 오픈채팅 링크</li><li>자동: 방문 횟수 통계(개인을 알아볼 수 없는 합계 숫자)</li><li><b>받지 않는 정보</b>: 아이 이름, 학교, 사진, 생년월일, 전화번호, 집 주소, 실시간 위치</li></ul>
    <h3>2. 이용 목적</h3>
    <ul><li>회원 식별, 학원 후기·정보 공유, 라이딩 품앗이 연결, 모임방 안내, 개인 스케줄러 제공</li><li>부정 이용 방지와 신고 처리</li><li>개인을 알아볼 수 없게 합친 통계(예: 동네별 학원 수요)로 서비스 개선</li></ul>
    <h3>3. 보관 기간과 파기</h3>
    <ul><li>회원 탈퇴 시 프로필, 후기, 라이딩 글, 스케줄을 즉시 삭제합니다. 학원 정보 수정 이력에는 닉네임 대신 '탈퇴회원'으로 남습니다.</li><li>운영자 백업 파일은 암호화해 보관하며, 백업 목적 외로 열람하지 않습니다.</li></ul>
    <h3>4. 제3자 제공</h3>
    <p>학딩은 회원 정보를 제3자에게 제공하지 않습니다. 법령에 따른 요청이 있는 경우만 예외입니다.</p>
    <h3>5. 처리 위탁 및 국외 이전</h3>
    <p>서비스 운영을 위해 Google LLC의 Firebase(로그인, 데이터 저장)를 이용합니다. 데이터베이스는 서울 리전에 저장되며, 로그인 처리 과정에서 정보가 미국 등 국외 서버에서 처리될 수 있습니다.</p>
    <h3>6. 회원의 권리</h3>
    <p>언제든 '내 정보'에서 프로필을 수정하거나 탈퇴할 수 있습니다. 만 14세 미만은 가입할 수 없습니다.</p>
    <h3>7. 문의</h3>
    <p>개인정보 보호 담당: 학딩 운영자 · ${esc(CONFIG.contactEmail)}</p>
  </div>`;
}

function aggTable() {
  const m = {};
  S.data.rides.forEach((r) => { const k = `${r.dong}|${acadName(r.academyId)}|${r.time.slice(0, 2)}시`; m[k] = (m[k] || 0) + 1 + keys(r.joins).length; });

  return rows.length ? `<div class="scroll-x"><table class="table"><thead><tr><th>동네</th><th>학원</th><th>시간대</th><th>가구</th></tr></thead><tbody>${rows.map(([k, n]) => `<tr>${k.split("|").map((x) => `<td>${esc(x)}</td>`).join("")}<td><b>${n}</b></td></tr>`).join("")}</tbody></table></div><p class="xs muted">개인을 알아볼 수 없는 합계예요. 학원 제휴·운송 제휴 영업 자료로 쓸 수 있어요.</p>` : `<div class="empty">데이터 없음</div>`;
}

function guessCol(k, h) {
  const p = { name: /^(학원|교습소)?명$|학원명|학원\/교습소명|교습소명/, address: /도로명주소|도로명|주소/, dong: /행정동|법정동명|^동$/, category: /교습과정|분야|교습계열/, target: /대상/, fee: /수강료|교습비/ }[k];
  return p ? p.test(h) : false;
}

function modal(html) {
  $("#layer").innerHTML = `<div class="modal-wrap" data-act="modalBg"><div class="modal" role="dialog" aria-modal="true">${html}<button class="btn ghost block" data-act="closeModal" type="button">닫기</button></div></div>`;
  const f = $("#layer .modal input, #layer .modal select, #layer .modal textarea"); if (f) setTimeout(() => f.focus(), 30);
}
function closeModal() { $("#layer").innerHTML = ""; }
function ask(msg, okLabel = "확인", danger = false) {
  return new Promise((res) => {
    $("#layer").innerHTML = `<div class="modal-wrap"><div class="modal" role="alertdialog" aria-modal="true"><p style="white-space:pre-line">${esc(msg)}</p><div class="grid2"><button class="btn ghost" id="askNo">취소</button><button class="btn ${danger ? "danger" : ""}" id="askYes">${esc(okLabel)}</button></div></div></div>`;
    $("#askNo").onclick = () => { closeModal(); res(false); };
    $("#askYes").onclick = () => { closeModal(); res(true); };
  });
}
let toastT;
function toast(m) { let t = $(".toast"); if (!t) { t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); } t.textContent = m; clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2600); }
function fail(e) { console.error(e); toast("저장하지 못했어요. 잠시 후 다시 시도해 주세요." + (e && e.code ? ` (${e.code})` : "")); }

/* ---------- 나이스 학원·교습소 정보 API ---------- */
function neisUrl(key, office, zone, page) {
  const u = new URL(NEIS_URL);
  const p = { KEY: key, Type: "json", pIndex: page, pSize: 1000, ATPT_OFCDC_SC_CODE: office };
  if (zone) p.ADMST_ZONE_NM = zone;
  Object.entries(p).forEach(([k, v]) => u.searchParams.set(k, v));
  return u.toString();
}
function neisRowsFromJson(j) {
  if (j && j.RESULT) { if (j.RESULT.CODE === "INFO-200") return []; throw new Error(j.RESULT.CODE + " " + j.RESULT.MESSAGE); }
  const body = j && j.acaInsTiInfo; if (!Array.isArray(body)) throw new Error("응답 형식이 달라요");
  const head = (body[0] && body[0].head) || []; const res = (head[1] && head[1].RESULT) || {};
  if (res.CODE && res.CODE !== "INFO-000") throw new Error(res.CODE + " " + res.MESSAGE);
  return (body[1] && body[1].row) || [];
}
async function neisFetchAll(key, office, zone, onProgress) {
  const all = []; let total = Infinity;
  for (let page = 1; page <= 60 && all.length < total; page++) {
    let j;
    try { const r = await fetch(neisUrl(key, office, zone, page)); j = await r.json(); }
    catch (e) { throw new Error("BLOCKED"); }
    if (j && j.RESULT && j.RESULT.CODE === "INFO-200") break;
    const rows = neisRowsFromJson(j);
    const head = j.acaInsTiInfo[0].head; total = Number(head[0].list_total_count) || rows.length;
    all.push(...rows); onProgress(all.length, total);
    if (rows.length < 1000) break;
  }
  return all;
}

function neisGroup(rows) {
  const m = new Map();
  rows.forEach((r) => {
    const id = String(r.ACA_ASNUM || "").trim(); if (!id) return;
    let g = m.get(id);
    if (!g) {
      const address = clip([r.FA_RDNMA, r.FA_RDNDA].filter(Boolean).join(" "), 80);
      g = { sourceId: id, name: clip(r.ACA_NM, 40), kind: r.ACA_INSTI_SC_NM || "", status: r.REG_STTUS_NM || "", address, dong: clip(extractDong(address), 20), phone: clip(r.FA_TELNO, 20), realm: new Set(), courses: new Set(), fees: new Set() };
      m.set(id, g);
    }
    [r.REALM_SC_NM, r.LE_ORD_NM].filter(Boolean).forEach((x) => g.realm.add(x));
    if (r.LE_CRSE_NM) g.courses.add(r.LE_CRSE_NM);
    if (r.LE_CRSE_LIST_NM && !r.LE_CRSE_NM) g.courses.add(r.LE_CRSE_LIST_NM);
    if (r.PSNBY_THCC_CNTNT && r.THCC_OTHBC_YN !== "N") g.fees.add(String(r.PSNBY_THCC_CNTNT).trim());
  });
  return [...m.values()].map((g) => { const realm = [...g.realm].join(", "), courses = [...g.courses].join(", "); return { ...g, realm, courses, fee: [...g.fees].join(" / "), category: mapCat(courses + " " + realm + " " + g.name) }; });
}
async function neisAnalyze(rows, region, filter, includeKyo) {
  const groups = neisGroup(rows);
  const blk = (await BE.db.get("config", "importBlock").catch(() => null)) || {};
  const blocked = new Set(blk.ids || []);
  const all = S.data.acadIndexed ? S.data.academies : await BE.db.list("academies").catch(() => S.data.academies);
  const ids = new Set(all.map((a) => a.id)), srcIds = new Set(all.map((a) => a.sourceId).filter(Boolean));
  const closedSrc = new Set(all.filter((a) => a.closed).map((a) => a.sourceId).filter(Boolean));
  const nameKeys = new Set(all.map((a) => normName(a.name) + "|" + (a.dong || "")));
  const words = String(filter || "").split(",").map((w) => w.trim()).filter(Boolean);
  const out = { region, rows: rows.length, total: groups.length, add: [], exist: 0, blocked: 0, closed: 0, kindSkip: 0, filtered: 0 };
  groups.forEach((g) => {
    if (words.length && !words.some((w) => g.address.includes(w))) { out.filtered++; return; }
    if (/폐원|휴원|말소|취소|폐지/.test(g.status)) { out.closed++; return; }
    if (!includeKyo && /교습소/.test(g.kind)) { out.kindSkip++; return; }
    if (blocked.has(g.sourceId) || blocked.has("name:" + normName(g.name) + "|" + g.dong) || closedSrc.has(g.sourceId)) { out.blocked++; return; }
    if (ids.has("neis_" + g.sourceId) || srcIds.has(g.sourceId) || nameKeys.has(normName(g.name) + "|" + g.dong)) { out.exist++; return; }
    out.add.push(g);
  });
  S.ui.neis = out; render();
}
function mapCat(s) {
  const m = [["수학", /수학|산수|연산/], ["영어", /영어|외국어|어학/], ["국어", /국어|독서|한글/], ["논술", /논술|글쓰기/], ["과학", /과학|물리|화학|생물/], ["코딩", /코딩|컴퓨터|정보|소프트웨어/], ["예체능", /음악|미술|피아노|태권|체육|무용|발레|수영|예능|운동/], ["종합", /종합|보습|입시|전과목/]];
  const f = m.find(([, re]) => re.test(s)); return f ? f[0] : "기타";
}

  for (let i = 0; i < t.length; i++) {
    const ch = t[i];
    if (q) { if (ch === '"') { if (t[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === ",") { row.push(cur); cur = ""; }
    else if (ch === "\n" || ch === "\r") { if (ch === "\r" && t[i + 1] === "\n") i++; row.push(cur); rows.push(row); row = []; cur = ""; }
    else cur += ch;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows;
}
function download(content, name, type) {
  const url = URL.createObjectURL(new Blob([content], { type }));
  const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function deriveKey(pw, salt) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: 250000, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function encryptText(text, pw) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(pw, salt);
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(text)));
  let bin = ""; for (let i = 0; i < ct.length; i += 0x8000) bin += String.fromCharCode(...ct.subarray(i, i + 0x8000));
  return { format: "hakding-backup-v1", kdf: "PBKDF2-SHA256-250000", cipher: "AES-256-GCM", salt: b64(salt), iv: b64(iv), data: btoa(bin) };
}
async function decryptText(obj, pw) {
  if (obj.format !== "hakding-backup-v1") throw new Error("형식 아님");
  const key = await deriveKey(pw, unb64(obj.salt));
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(obj.iv) }, key, unb64(obj.data));
  return new TextDecoder().decode(pt);
}
